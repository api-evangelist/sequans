apis:
- aid: sequans-site-mcp
  name: Sequans Website MCP Server
  description: 'A Model Context Protocol server exposed by the WordPress MCP Adapter running on the
    sequans.com corporate site. Two MCP endpoints are registered and enumerable anonymously through the
    WordPress REST route index (/wp-json/mcp): mcp-oauth-server and mcp-adapter-default-server. Both
    reject anonymous JSON-RPC calls with HTTP 401, so the live tool list is auth-gated, but the OAuth
    discovery documents (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource)
    are served anonymously and declare an authorization-code + PKCE (S256) flow with a single "mcp" scope.
    This is the corporate website''s agent surface, not an API for Sequans chip or module products.'
  humanURL: https://sequans.com/
  baseURL: https://sequans.com/wp-json/mcp/mcp-oauth-server
