aid: sequans
name: Sequans
description: 'Sequans Communications S.A. (NYSE: SQNS) is a fabless semiconductor company founded in 2003
  and headquartered in Paris, France, designing and supplying 5G and 4G cellular IoT chips and modules.
  Its massive-IoT portfolio is built on the Monarch LTE-M/NB-IoT and Calliope Cat 1bis platforms, and its
  broadband-IoT portfolio on the Cassiopeia Cat 4/Cat 6 and Taurus 5G platforms, alongside the Iris
  software-defined RF transceiver and licensable silicon and software IP. Sequans sells chips, modules and
  IP to device makers rather than a developer-facing web API: its technical documentation, firmware, SDKs
  and AT-command references are distributed through the my.sequans.com support zone and the
  download.sequans.com customer portal, both of which require an account. The only anonymously reachable
  machine-readable surfaces on sequans.com are the WordPress REST API behind the corporate site and a
  WordPress MCP Adapter server advertised through RFC 8414 / RFC 9728 OAuth discovery documents.'
