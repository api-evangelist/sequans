description: >-
  Well-known discovery surface probed across the Sequans hosts on 2026-09-16. sequans.com serves
  RFC 8414 OAuth authorization-server metadata and RFC 9728 OAuth protected-resource metadata, both
  emitted by the WordPress MCP Adapter on the corporate site and both pointing at the remote MCP
  server https://sequans.com/wp-json/mcp/mcp-oauth-server. The authorization_servers entry names
  sequans.com itself, so there is no third auth host to probe. No security.txt (RFC 9116), no
  api-catalog (RFC 9727), no OpenID Connect discovery, no ai-plugin.json, no MCP manifest and no
  A2A agent card (agent-card.json or legacy agent.json) is served on any host. sequans.com answers
  unmatched /.well-known/* paths with an HTTP 404 HTML page, so the two 200s are genuine JSON
  documents, not a catch-all.
